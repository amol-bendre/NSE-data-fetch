name: Fetch NSE Bhavcopy

on:
  schedule:
    # All times UTC. IST = UTC + 5:30.
    # Minutes shifted off round numbers (was :30/:00/:00) to avoid the
    # heaviest GitHub Actions runner-queue contention, which peaks at
    # :00 and :30 past the hour.
    - cron: '37 16 * * 1-5'   # 10:07 PM IST -- original attempt
    - cron: '7 17 * * 1-5'    # 10:37 PM IST -- retry 1
    - cron: '2 18 * * 1-5'    # 11:32 PM IST -- retry 2 (last attempt)
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD). Leave blank to use today (IST).'
        required: false
        default: ''

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run fetch script
        id: fetch
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          DATA_REPO: amol-bendre/stock-market-data
          TARGET_DATE: ${{ github.event.inputs.date }}
        run: python fetch_bhavcopy.py

      # Runs regardless of whether the fetch step above succeeded, failed,
      # or crashed outright -- this is the only step that ever touches
      # Telegram. It only sends a message on the last scheduled attempt
      # (11:32 PM IST); manual workflow_dispatch runs never alert, since
      # github.event.schedule is unset for those.
      - name: Telegram alert (last attempt only)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IS_LAST_ATTEMPT: ${{ github.event.schedule == '2 18 * * 1-5' }}
          JOB_LABEL: "Bhavcopy"
          STATUS: ${{ steps.fetch.outputs.available == 'true' && 'success' || 'failure' }}
          REPORT_DATE: ${{ steps.fetch.outputs.bhav_date }}
        run: python telegram_alert.py
