name: Fetch NSE Bhavcopy

on:
  schedule:
    # All times UTC. IST = UTC + 5:30.
    - cron: '30 16 * * 1-5'   # 10:00 PM IST -- original attempt
    - cron: '0 17 * * 1-5'    # 10:30 PM IST -- retry 1
    - cron: '0 18 * * 1-5'    # 11:30 PM IST -- retry 2
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD). Leave blank to use today (IST).'
        required: false
        default: ''

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run fetch script
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          DATA_REPO: amol-bendre/stock-market-data
          TARGET_DATE: ${{ github.event.inputs.date }}
        run: python fetch_bhavcopy.py
