name: Daily NSE Data Fetch

on:
  schedule:
    # All times UTC. IST = UTC + 5:30. Both fetch jobs run in parallel on
    # every attempt below. Minutes kept off round numbers to avoid GitHub
    # Actions runner-queue contention, which peaks at :00/:30.
    - cron: '37 15 * * 1-5'   # 9:07 PM IST -- original attempt
    - cron: '7 16 * * 1-5'    # 9:37 PM IST -- retry 1
    - cron: '2 17 * * 1-5'    # 10:32 PM IST -- retry 2 (last attempt)
  workflow_dispatch:
    inputs:
      bhav_date:
        description: 'Bhavcopy: target date (YYYY-MM-DD). Leave blank for today (IST).'
        required: false
        default: ''
      fii_date:
        description: 'FII reports: single target date (YYYY-MM-DD). Leave blank for today (IST).'
        required: false
        default: ''
      fii_start_date:
        description: 'FII reports backfill: range start (YYYY-MM-DD). Requires fii_end_date too.'
        required: false
        default: ''
      fii_end_date:
        description: 'FII reports backfill: range end (YYYY-MM-DD, inclusive). Requires fii_start_date too.'
        required: false
        default: ''

jobs:
  # Computes the IST trading date each scheduled run should target, so a
  # run delayed past midnight IST by GitHub's runner queue still completes
  # the PREVIOUS evening's job instead of rolling over to fetch a date that
  # hasn't traded yet. None of the 3 scheduled attempts above ever legitimately
  # intend to land between midnight and 6 AM IST -- if a run wakes up in that
  # window, it's a delayed run of the prior evening's schedule, so it targets
  # yesterday (IST) instead of today. Manual workflow_dispatch runs with an
  # explicit date input override this entirely -- see the fallback logic in
  # the bhavcopy/fii jobs below.
  compute-date:
    runs-on: ubuntu-latest
    outputs:
      trading_date: ${{ steps.calc.outputs.trading_date }}
    steps:
      - name: Compute intended IST trading date
        id: calc
        run: |
          hour_ist=$(TZ='Asia/Kolkata' date +'%H')
          today_ist=$(TZ='Asia/Kolkata' date +'%Y-%m-%d')
          if [ "$hour_ist" -lt 6 ]; then
            trading_date=$(TZ='Asia/Kolkata' date -d "$today_ist -1 day" +'%Y-%m-%d')
            echo "Current IST hour is $hour_ist (< 6) -- treating this as a delayed run of the previous evening's job. Using $trading_date instead of $today_ist."
          else
            trading_date="$today_ist"
            echo "Current IST hour is $hour_ist -- using today's date: $trading_date"
          fi
          echo "trading_date=$trading_date" >> "$GITHUB_OUTPUT"

  bhavcopy:
    needs: compute-date
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.fetch.outputs.available }}
      bhav_date: ${{ steps.fetch.outputs.bhav_date }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run fetch script
        id: fetch
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          DATA_REPO: amol-bendre/stock-market-data
          # Manual date input always wins if explicitly set; otherwise fall
          # back to the rollover-safe computed date from compute-date.
          TARGET_DATE: ${{ github.event.inputs.bhav_date != '' && github.event.inputs.bhav_date || needs.compute-date.outputs.trading_date }}
        run: python fetch_bhavcopy.py

  fii:
    needs: compute-date
    runs-on: ubuntu-latest
    outputs:
      fii_stats_ok: ${{ steps.fetch.outputs.fii_stats_ok }}
      participant_oi_ok: ${{ steps.fetch.outputs.participant_oi_ok }}
      fii_date: ${{ steps.fetch.outputs.fii_date }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run fetch script
        id: fetch
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          DATA_REPO: amol-bendre/stock-market-data
          # Manual single-date input always wins if explicitly set; otherwise
          # fall back to the rollover-safe computed date from compute-date.
          # Backfill mode (start/end date) is unaffected either way -- the
          # script checks START_DATE/END_DATE first and ignores TARGET_DATE
          # entirely when both are present.
          TARGET_DATE: ${{ github.event.inputs.fii_date != '' && github.event.inputs.fii_date || needs.compute-date.outputs.trading_date }}
          START_DATE: ${{ github.event.inputs.fii_start_date }}
          END_DATE: ${{ github.event.inputs.fii_end_date }}
        run: python fetch_fii_derivatives.py

  # Waits for both fetch jobs regardless of their outcome (if: always()
  # overrides the default "needs must succeed" behavior), then sends ONE
  # combined Telegram message -- only on the shared last scheduled attempt
  # (10:32 PM IST). Manual workflow_dispatch runs never alert, since
  # github.event.schedule is unset for those.
  alert:
    needs: [bhavcopy, fii]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Telegram alert (last attempt only, combined)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IS_LAST_ATTEMPT: ${{ github.event.schedule == '2 17 * * 1-5' }}
          JOB1_LABEL: "Bhavcopy"
          JOB1_STATUS: ${{ needs.bhavcopy.outputs.available == 'true' && 'success' || 'failure' }}
          JOB1_DATE: ${{ needs.bhavcopy.outputs.bhav_date }}
          JOB2_LABEL: "FII Reports"
          JOB2_STATUS: ${{ (needs.fii.outputs.fii_stats_ok == 'true' && needs.fii.outputs.participant_oi_ok == 'true') && 'success' || ((needs.fii.outputs.fii_stats_ok == 'true' || needs.fii.outputs.participant_oi_ok == 'true') && 'partial' || 'failure') }}
          JOB2_DETAIL: ${{ needs.fii.outputs.fii_stats_ok != 'true' && 'FII Derivatives Statistics missing' || (needs.fii.outputs.participant_oi_ok != 'true' && 'Participant-wise OI missing' || '') }}
          JOB2_DATE: ${{ needs.fii.outputs.fii_date }}
        run: python telegram_alert.py
