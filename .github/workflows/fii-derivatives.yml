name: Fetch NSE FII Derivatives Data

on:
  schedule:
    # All times UTC. IST = UTC + 5:30.
    # Staggered 5 minutes after each bhavcopy attempt (10:07/10:37/11:32 PM
    # IST), so both fetchers run back-to-back for easy scanning in the
    # Actions log. Minutes kept off round numbers for the same runner-queue
    # contention reasons as bhavcopy.yml.
    - cron: '42 16 * * 1-5'   # 10:12 PM IST -- original attempt
    - cron: '12 17 * * 1-5'   # 10:42 PM IST -- retry 1
    - cron: '7 18 * * 1-5'    # 11:37 PM IST -- retry 2 (last attempt)
  workflow_dispatch:
    inputs:
      date:
        description: 'Single target date (YYYY-MM-DD). Leave blank to use today (IST).'
        required: false
        default: ''
      start_date:
        description: 'Backfill mode: range start (YYYY-MM-DD). Requires end_date too.'
        required: false
        default: ''
      end_date:
        description: 'Backfill mode: range end (YYYY-MM-DD, inclusive). Requires start_date too.'
        required: false
        default: ''

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run fetch script
        id: fetch
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          DATA_REPO: amol-bendre/stock-market-data
          TARGET_DATE: ${{ github.event.inputs.date }}
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: python fetch_fii_derivatives.py

      # Runs regardless of whether the fetch step above succeeded, failed,
      # or crashed outright. Only sends a message on the last scheduled
      # attempt (11:37 PM IST); manual workflow_dispatch runs (including
      # backfill) never alert, since github.event.schedule is unset for
      # those. STATUS/DETAIL are computed here from the two report-level
      # flags -- telegram_alert.py itself has no idea what "FII reports"
      # or "bhavcopy" even are, it just turns a status word into a message.
      - name: Telegram alert (last attempt only)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IS_LAST_ATTEMPT: ${{ github.event.schedule == '7 18 * * 1-5' }}
          JOB_LABEL: "FII Reports"
          STATUS: ${{ (steps.fetch.outputs.fii_stats_ok == 'true' && steps.fetch.outputs.participant_oi_ok == 'true') && 'success' || ((steps.fetch.outputs.fii_stats_ok == 'true' || steps.fetch.outputs.participant_oi_ok == 'true') && 'partial' || 'failure') }}
          DETAIL: ${{ steps.fetch.outputs.fii_stats_ok != 'true' && 'FII Derivatives Statistics missing' || (steps.fetch.outputs.participant_oi_ok != 'true' && 'Participant-wise OI missing' || '') }}
          REPORT_DATE: ${{ steps.fetch.outputs.fii_date }}
        run: python telegram_alert.py
